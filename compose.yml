name: vex-agent-integration

# Single all-in-one dev container: Postgres + API + client. This branch exists so a
# teammate can `docker compose up` and get a fully seeded, working stack with nothing
# to wire. Production does NOT run this -- it keeps the services split behind nginx
# (see README "Serving It Remotely"). Application code is unchanged; only packaging.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Never drain the whole Invite Hub history on the API's startup path -- against a
      # fresh database that starves the app and resets connections. Forced off for the
      # local container unless a dev explicitly opts in via .env. Pull Hub logs on
      # demand instead (see the README).
      INVITE_HUB_SYNC_ON_BOOT: "${INVITE_HUB_SYNC_ON_BOOT:-false}"
    ports:
      - "127.0.0.1:5173:5173"   # the UI (open this)
      - "127.0.0.1:8001:8000"   # the API (the browser + client call this)
      - "127.0.0.1:5433:5432"   # Postgres, for optional inspection from the host
    extra_hosts:
      # Lets the container reach Ollama running natively on the host Mac at
      # host.docker.internal:11434 (see OPENAI_BASE_URL in .env).
      - "host.docker.internal:host-gateway"
    volumes:
      - pgdata:/var/lib/postgresql/data          # DB survives restarts
      - ./server/vex_agent:/app/server/vex_agent  # backend hot-reload (uvicorn --reload)
      - ./client/src:/app/client/src              # frontend hot-reload (Vite HMR)
      - ./client/index.html:/app/client/index.html

volumes:
  pgdata:
