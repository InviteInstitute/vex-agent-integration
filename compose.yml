name: vex-agent-integration

services:
  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: vexagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vexagent
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vexagent -d vexagent"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:5433:5432"

  api:
    build: ./server
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      # Invite Hub sync cursor. Bind-mounted so a container rebuild/recreate can't
      # wipe it back to zero, which forces the next sync into a full-history
      # re-drain (thousands of sequential Hub requests) -- that drain runs *inline*
      # in the request path (maybe_sync_invite_hub_logs), so it was blocking real
      # chat requests for minutes. Bit us once already. The destination must match
      # DEFAULT_STATE_PATH in vex_agent/ingest/fetch_invite_hub_logs.py (the cursor
      # resolves next to that module), or the mount persists a file nobody reads.
      - ./server/state/invite_hub_sync_state.json:/app/vex_agent/ingest/invite_hub_sync_state.json

volumes:
  pgdata:
