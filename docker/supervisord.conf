; Runs the three dev processes in one container. All logs go to the container's
; stdout/stderr so `docker compose logs -f` shows postgres, the API, and Vite
; together. Postgres must not run as root, so that program drops to the postgres
; user; the API and client inherit the container env (compose `env_file`).
[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:postgres]
; listen on all interfaces so the host-published :5433 works; the host bind is
; loopback-only (compose.yml) and pg_hba still requires a password.
command=postgres -D /var/lib/postgresql/data -c listen_addresses=* -c port=5432
user=postgres
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=uvicorn vex_agent.app:app --host 0.0.0.0 --port 8000 --reload
directory=/app/server
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:client]
command=npm run dev -- --host 0.0.0.0 --port 5173
directory=/app/client
priority=30
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
